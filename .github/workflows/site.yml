# Project-owned. Deploys site/ to Cloudflare Pages with the latest release's
# two .zip files and their index.json. Publishing a release first builds
# Kompass and Kompass Native from the tag and attaches both to the release.
name: site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: write # attach the .zip files to the release

concurrency:
  group: site

env:
  BLENDER_VERSION: 5.2.4
  BLENDER_SHA256: 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libice6 libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$archive" "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$archive"
          echo "${BLENDER_SHA256}  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          rm "$archive"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Build both editions and attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('kompass/blender_manifest.toml', 'rb'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the manifest version $version." >&2
            exit 1
          fi
          blender --background --factory-startup --python-exit-code 1 --python build.py
          gh release upload "$TAG" "kompass-$version.zip" "kompass_native-$version.zip" --clobber

      # The site serves each edition under one name, so the download links never change.
      - name: Put the latest release on the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release download --pattern 'kompass*.zip' --dir "$RUNNER_TEMP/release"; then
            mkdir -p site/public/download
            for edition in kompass kompass_native; do
              cp "$RUNNER_TEMP"/release/"$edition"-*.zip "site/public/download/$edition.zip"
            done
            blender --command extension server-generate --repo-dir site/public/download
          else
            echo "No release with a .zip yet: the site deploys without a download."
          fi

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The first run creates the Pages project. --branch main makes every
        # deploy, including one from a release tag, the production one.
        run: |
          if ! npx --yes wrangler@4.154.0 pages project list --json | grep -q '"kompass-site"'; then
            npx --yes wrangler@4.154.0 pages project create kompass-site --production-branch main
          fi
          npx --yes wrangler@4.154.0 pages deploy --branch main
