# Project-owned. Unit tests, then the smoke test and the interface test in the
# minimum supported Blender.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BLENDER_VERSION: 5.2.4
  BLENDER_SHA256: 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Blender 5.2 ships Python 3.13.
          python-version: '3.13'

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libice6 libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1 \
            libgl1-mesa-dri xvfb
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -sSfL -o "$archive" "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$archive"
          echo "${BLENDER_SHA256}  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          rm "$archive"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - run: python3 tests/smoke/run.py

      # Blender's window on a virtual display, drawn by Mesa in software.
      - run: xvfb-run -a python3 tests/smoke/run.py --interface
